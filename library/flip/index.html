<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ink flipbooks</title>
<style>:root{--paper:#F4F2EC;--ink:#1B1B1A}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.4 -apple-system,system-ui,sans-serif;padding:24px 16px}h1{font-weight:600;font-size:22px;margin:0 0 4px}p{margin:0 0 20px;color:#555}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}figure{margin:0;background:#FAF9F6;border-radius:10px;overflow:hidden}iframe{width:100%;aspect-ratio:1;border:0;display:block;pointer-events:none}figcaption{padding:8px 12px 12px;font-size:13px}</style></head>
<body><h1>Animations image par image</h1><p>12 images par seconde, une boucle d'environ une seconde.</p><main><figure><iframe src="accordion/anim.html" loading="lazy" scrolling="no"></iframe><figcaption><b>accordion</b> Le soufflet s'ouvre et se ferme · 12 images, 1.0 s</figcaption></figure><figure><iframe src="binoculars/anim.html" loading="lazy" scrolling="no"></iframe><figcaption><b>binoculars</b> Il baisse les jumelles et les remonte · 12 images, 1.0 s</figcaption></figure><figure><iframe src="camera-flash/anim.html" loading="lazy" scrolling="no"></iframe><figcaption><b>camera-flash</b> Le flash part · 12 images, 1.0 s</figcaption></figure><figure><iframe src="chart-rises/anim.html" loading="lazy" scrolling="no"></iframe><figcaption><b>chart-rises</b> Les barres montent, il lève le poing · 12 images, 1.0 s</figcaption></figure><figure><iframe src="coffee-ripples/anim.html" loading="lazy" scrolling="no"></iframe><figcaption><b>coffee-ripples</b> Le café ondule, la vapeur monte · 12 images, 1.0 s</figcaption></figure><figure><iframe src="coffee-sip/anim.html" loading="lazy" scrolling="no"></iframe><figcaption><b>coffee-sip</b> Il prend son café et boit · 12 images, 1.0 s</figcaption></figure><figure><iframe src="door-open/anim.html" loading="lazy" scrolling="no"></iframe><figcaption><b>door-open</b> La porte s'ouvre et se referme · 12 images, 1.0 s</figcaption></figure><figure><iframe src="gift-give/anim.html" loading="lazy" scrolling="no"></iframe><figcaption><b>gift-give</b> Il tend le cadeau · 12 images, 1.0 s</figcaption></figure><figure><iframe src="laces-tie/anim.html" loading="lazy" scrolling="no"></iframe><figcaption><b>laces-tie</b> Les lacets se nouent · 12 images, 1.0 s</figcaption></figure><figure><iframe src="run/anim.html" loading="lazy" scrolling="no"></iframe><figcaption><b>run</b> Il court · 12 images, 1.0 s</figcaption></figure><figure><iframe src="suitcase-run/anim.html" loading="lazy" scrolling="no"></iframe><figcaption><b>suitcase-run</b> Il court avec sa valise · 12 images, 1.0 s</figcaption></figure><figure><iframe src="sofa-typing/anim.html" loading="lazy" scrolling="no"></iframe><figcaption><b>sofa-typing</b> Ses mains tapent · 16 images, 1.3 s</figcaption></figure><figure><iframe src="yoga/anim.html" loading="lazy" scrolling="no"></iframe><figcaption><b>yoga</b> Il lève les bras, pose de l'arbre · 12 images, 1.0 s</figcaption></figure></main></body></html>
